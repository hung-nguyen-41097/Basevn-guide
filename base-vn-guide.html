<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hướng Dẫn Sử Dụng BaseVN</title>
    <link rel="stylesheet" href="base-vn-guide.css" />
  </head>
  <body>
    <header>
      <button
        type="button"
        class="menu-toggle"
        aria-label="Mở mục lục"
        aria-controls="section-menu"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>
      <h1>📖 Hướng dẫn sử dụng các tính năng của BaseVN</h1>
    </header>

    <div class="layout">
      <nav class="section-menu" id="section-menu" aria-label="Mục lục hướng dẫn">
        <div class="menu-group">
          <div class="menu-heading">WEB</div>
          <div class="menu-links">
            <a href="web/dang-nhap.html" target="content-frame">Đăng nhập</a>
            <a
              href="web/quy-trinh-de-xuat-thanh-toan-ky-so.html"
              target="content-frame"
            >
              Quy trình Đề xuất, Thanh toán & Ký số
            </a>
            <a href="web/dat-phong-hop.html" target="content-frame">
              Base Booking (Đặt phòng họp)
            </a>
          </div>
        </div>
        <div class="menu-group">
          <div class="menu-heading">MOBILE</div>
          <div class="menu-links">
            <a href="mobile/dang-nhap.html" target="content-frame">Đăng nhập</a>
            <a href="mobile/checkin.html" target="content-frame">Checkin</a>
          </div>
        </div>
      </nav>

      <div class="menu-backdrop" hidden></div>

      <main class="container">
        <iframe
          class="content-frame"
          name="content-frame"
          title="Nội dung hướng dẫn"
          src="web/dang-nhap.html"
        ></iframe>
      </main>
    </div>

    <script>
      (function () {
        var frame = document.querySelector("iframe.content-frame");
        var links = document.querySelectorAll('.menu-links a[target="content-frame"]');
        var toggle = document.querySelector(".menu-toggle");
        var backdrop = document.querySelector(".menu-backdrop");

        function setMenuOpen(open) {
          document.body.classList.toggle("menu-open", open);
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.setAttribute("aria-label", open ? "Đóng mục lục" : "Mở mục lục");
          backdrop.hidden = !open;
        }

        toggle.addEventListener("click", function () {
          setMenuOpen(!document.body.classList.contains("menu-open"));
        });
        backdrop.addEventListener("click", function () {
          setMenuOpen(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setMenuOpen(false);
        });

        function setActive(page) {
          links.forEach(function (link) {
            link.classList.toggle("active", link.getAttribute("href") === page);
          });
        }

        function loadPage(page, updateHash) {
          if (!page) return;
          frame.src = page;
          setActive(page);
          if (updateHash) {
            history.pushState(null, "", "#" + page);
          }
        }

        links.forEach(function (link) {
          link.addEventListener("click", function (e) {
            e.preventDefault();
            loadPage(link.getAttribute("href"), true);
            setMenuOpen(false);
          });
        });

        window.addEventListener("popstate", function () {
          var page = location.hash.slice(1);
          if (page) {
            frame.src = page;
            setActive(page);
          }
        });

        var initialPage = location.hash.slice(1);
        if (initialPage) {
          loadPage(initialPage, false);
        } else {
          setActive(frame.getAttribute("src"));
        }
      })();
    </script>
  </body>
</html>
